<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HEISEI KAWAII♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    /* リアルタイムカメラ映像 */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* インカメラ時の鏡像反転用CSS */
    #video.mirror {
      transform: scaleX(-1);
    }
    /* フレーム画像 */
    #frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
      display: none;
    }
    #canvas {
      display: none;
    }
    /* スタートボタン */
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: #ff1493;
      color: #fff;
      padding: 18px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.6);
      border: 3px solid #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    /* 操作UI領域 */
    #ui-container {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 95%;
      max-width: 400px;
    }
    /* フレーム切り替えボタンバー（5個並び用に微調整） */
    .frame-selector {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 8px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      width: 100%;
      justify-content: center;
    }
    .frame-btn {
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      border: 2px solid #fff;
      border-radius: 20px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
      white-space: nowrap;
    }
    .frame-btn.active {
      background: #ff1493;
      color: #fff;
      border-color: #fff;
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
    }
    /* ボタン配置用の行 */
    .shutter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      position: relative;
    }
    /* シャッターボタン */
    #shutter-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #ff69b4;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    #shutter-btn:active {
      transform: scale(0.92);
    }
    /* カメラ切り替えボタン */
    #flip-btn {
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }
    /* 撮影結果モーダル */
    #result-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    #preview-img {
      max-width: 85%;
      max-height: 60vh;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
      user-select: auto !important;
      -webkit-user-select: auto !important;
    }
    .guide-text {
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
      background: #ff1493;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-align: center;
    }
    .btn-group {
      margin-top: 12px;
    }
    .action-btn {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #333;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="start-btn" onclick="initCamera()">💖 カメラスタート 💖</div>

  <video id="video" autoplay playsinline muted></video>
  <img id="frame" src="frame1.PNG" alt="平成フレーム">

  <div id="ui-container">
    <div class="frame-selector">
      <button class="frame-btn active" onclick="changeFrame('frame1.PNG', this)">枠 ①</button>
      <button class="frame-btn" onclick="changeFrame('frame2.PNG', this)">枠 ②</button>
      <button class="frame-btn" onclick="changeFrame('frame3.PNG', this)">枠 ③</button>
      <button class="frame-btn" onclick="changeFrame('frame4.PNG', this)">枠 ④</button>
      <button class="frame-btn" onclick="changeFrame('frame5.PNG', this)">㊙</button>
    </div>
    
    <div class="shutter-row">
      <button id="shutter-btn" onclick="takePhoto()"></button>
      <button id="flip-btn" onclick="toggleCamera()" title="カメラ切り替え">🔄</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="result-modal">
    <img id="preview-img" alt="撮影結果">
    <div class="guide-text">👆 画像を長押しして「写真に保存」してね 💖</div>
    <div class="btn-group">
      <button class="action-btn" onclick="closePreview()">もう一度撮る</button>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('canvas');
  const startBtn = document.getElementById('start-btn');
  const uiContainer = document.getElementById('ui-container');
  const resultModal = document.getElementById('result-modal');
  const previewImg = document.getElementById('preview-img');

  let currentStream = null;
  let useFacingMode = "environment";

  // カメラ起動処理
  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: useFacingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      }).catch(async () => {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
      });

      currentStream = stream;
      video.srcObject = stream;
      await video.play();

      if (useFacingMode === "user") {
        video.classList.add('mirror');
      } else {
        video.classList.remove('mirror');
      }

    } catch (err) {
      alert("カメラの起動に失敗しました。権限や端末のカメラ状態を確認してください。");
    }
  }

  // 初期起動ボタンの処理
  async function initCamera() {
    await startCamera();
    startBtn.style.display = 'none';
    uiContainer.style.display = 'flex';
    frame.style.display = 'block';
  }

  // 内/外カメラの切り替え
  async function toggleCamera() {
    useFacingMode = (useFacingMode === "environment") ? "user" : "environment";
    await startCamera();
  }

  // フレーム切り替え
  function changeFrame(fileName, btnElement) {
    frame.src = fileName;
    const buttons = document.querySelectorAll('.frame-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
  }

  // 撮影＆合成処理
  function takePhoto() {
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    if (useFacingMode === "user") {
      context.translate(canvas.width, 0);
      context.scale(-1, 1);
    }
    
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (useFacingMode === "user") {
      context.setTransform(1, 0, 0, 1, 0, 0);
    }

    if (frame.complete && frame.naturalWidth !== 0) {
      context.drawImage(frame, 0, 0, canvas.width, canvas.height);
    }

    const dataUrl = canvas.toDataURL('image/png');
    previewImg.src = dataUrl;
    resultModal.style.display = 'flex';
  }

  function closePreview() {
    resultModal.style.display = 'none';
  }
</script>

</body>
</html>
