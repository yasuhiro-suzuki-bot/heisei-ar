<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HEISEI KAWAII♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    /* リアルタイムカメラ映像 */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* フレーム画像（最初は非表示） */
    #frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
      display: none; /* 初期状態は非表示 */
    }
    /* 内部計算用（非表示） */
    #canvas {
      display: none;
    }
    /* スタートボタン */
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: #ff1493;
      color: #fff;
      padding: 18px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.6);
      border: 3px solid #fff;
      cursor: pointer;
      white-space: nowrap; /* ★文字を絶対に改行させない */
    }
    /* 操作UI領域 */
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 400px;
    }
    /* フレーム切り替えボタンバー */
    .frame-selector {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      width: 100%;
      justify-content: center;
    }
    .frame-btn {
      background: rgba(255, 255, 255, 0.8);
      color: #333;
      border: 2px solid #fff;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
    }
    .frame-btn.active {
      background: #ff1493;
      color: #fff;
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
    }
    /* シャッターボタン */
    #shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #ff69b4;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    #shutter-btn:active {
      transform: scale(0.92);
    }
    /* 撮影結果モーダル */
    #result-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #preview-img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
      user-select: auto !important;
      -webkit-user-select: auto !important;
    }
    .guide-text {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      margin-top: 15px;
      background: #ff1493;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-align: center;
    }
    .btn-group {
      margin-top: 15px;
    }
    .action-btn {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #333;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="start-btn" onclick="initCamera()">💖 カメラスタート 💖</div>

  <video id="video" autoplay playsinline muted></video>
  <img id="frame" src="frame1.PNG" alt="平成フレーム">

  <div id="ui-container">
    <div class="frame-selector">
      <button class="frame-btn active" onclick="changeFrame('frame1.PNG', this)">枠 ①</button>
      <button class="frame-btn" onclick="changeFrame('frame2.PNG', this)">枠 ②</button>
      <button class="frame-btn" onclick="changeFrame('frame3.PNG', this)">枠 ③</button>
      <button class="frame-btn" onclick="changeFrame('frame4.PNG', this)">枠 ④</button>
    </div>
    <button id="shutter-btn" onclick="takePhoto()"></button>
  </div>

  <canvas id="canvas"></canvas>

  <div id="result-modal">
    <img id="preview-img" alt="撮影結果">
    <div class="guide-text">👆 画像を長押しして「写真に保存」してね 💖</div>
    <div class="btn-group">
      <button class="action-btn" onclick="closePreview()">もう一度撮る</button>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('canvas');
  const startBtn = document.getElementById('start-btn');
  const uiContainer = document.getElementById('ui-container');
  const resultModal = document.getElementById('result-modal');
  const previewImg = document.getElementById('preview-img');

  // カメラ起動
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      
      startBtn.style.display = 'none';
      uiContainer.style.display = 'flex';
      frame.style.display = 'block'; // ★カメラ起動後にフレームを表示
    } catch (err) {
      alert("カメラの起動に失敗しました。ブラウザのカメラ権限を確認してください。");
    }
  }

  // フレーム切り替え関数
  function changeFrame(fileName, btnElement) {
    frame.src = fileName;
    
    // ボタンのハイライト表示切り替え
    const buttons = document.querySelectorAll('.frame-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
  }

  // 撮影＆合成処理
  function takePhoto() {
    const context = canvas.getContext('2d');
    
    // 画面の解像度に合わせてキャンバスサイズを設定
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // 1. カメラ映像を描画
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // 2. 現在選択中のフレームを描画（全面にフィットさせる）
    if (frame.complete && frame.naturalWidth !== 0) {
      context.drawImage(frame, 0, 0, canvas.width, canvas.height);
    }

    // 3. モーダル表示
    const dataUrl = canvas.toDataURL('image/png');
    previewImg.src = dataUrl;
    resultModal.style.display = 'flex';
  }

  function closePreview() {
    resultModal.style.display = 'none';
  }
</script>

</body>
</html>
